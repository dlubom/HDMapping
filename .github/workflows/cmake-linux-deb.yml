# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build Debian package

on:
  workflow_dispatch:
  push:
    branches: [ "main", "mcp/**" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

# A PR and its branch push validate the same head; keep one active run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJSON((startsWith(github.ref, 'refs/heads/mcp/') || startsWith(github.head_ref, 'mcp/')) && '["ON","OFF"]' || '["ON"]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Load repository cache
      run:  sudo apt-get update --allow-releaseinfo-change
    - name: Install Libs
      run: sudo apt-get install -y --no-install-recommends libeigen3-dev libglew-dev freeglut3-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libtbb-dev liblaszip-dev libopencv-dev libproj-dev libbz2-dev

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        submodules: true
        fetch-depth: 0

    - name: Set version
      run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
    
    - name: Install CMake 4.0
      run: |
        wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.0.0/cmake-4.0.0-linux-x86_64.sh
        sudo sh cmake.sh --skip-license --prefix=/usr/local
        cmake --version

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_WITH_UTILITY_APPLICATION=ON -DBUILD_WITH_BUNDLED_FREEGLUT=0 -DBUILD_WITH_BUNDLED_EIGEN=0 -DBUILD_WITH_BUNDLED_LIBLASZIP=0 -DBUILD_WITH_BUNDLED_ONETBB=0 -DBUILD_TESTING=ON ${{ matrix.mcp == 'OFF' && '-DBUILD_WITH_MCP=OFF -DHDMAPPING_GO_EXECUTABLE=must-not-run-go' || '' }} -DHDMAPPING_MCP_QUALITY=${{ matrix.mcp }} -DCPACK_PACKAGE_FILE_NAME=hd_mapping-${{env.VERSION}}-amd64
  
    - name: Check MCP quality
      if: matrix.mcp == 'ON'
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target mcp-check mcp-check-controls

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target package

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Check installed product relocation
      run: python3 scripts/check_mcp_install.py --build-dir build --config ${{env.BUILD_TYPE}} --mcp ${{ matrix.mcp }}

    - name: Check Debian package relocation
      run: |
        dpkg-deb --extract "build/hd_mapping-${VERSION}-amd64.deb" "$RUNNER_TEMP/debian-package"
        python3 scripts/check_mcp_install.py --build-dir build --config ${{env.BUILD_TYPE}} --mcp ${{ matrix.mcp }} --package-dir "$RUNNER_TEMP/debian-package/usr" --package-executable bin/hdmapping-hdmapping_mcp

    - name: Upload Debian package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: hd_mapping-deb-${{env.VERSION}}${{ matrix.mcp == 'ON' && '-mcp' || '' }}
        path: ${{github.workspace}}/build/*.deb

    - name: Attach to GitHub release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{github.workspace}}/build/*.deb
